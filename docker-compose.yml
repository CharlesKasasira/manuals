services:
  mysql:
    image: mysql:8.4
    container_name: manualflow-mysql
    environment:
      MYSQL_DATABASE: manualflow
      MYSQL_USER: manualflow
      MYSQL_PASSWORD: manualflow
      MYSQL_ROOT_PASSWORD: manualflow-root
    ports:
      - "3306:3306"
    volumes:
      - manualflow-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  manualflow-mysql:
